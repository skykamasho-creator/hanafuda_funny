<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>まどろみ花札 - Madoromi Hanafuda</title>
  <style>
    :root {
      --color-noridark: #101914;
      --color-norimedium: #1a2820;
      --color-moon: #f3ebce;
      --color-text: #e0e6e2;
      --color-card-bg: #fdfbf7;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--color-noridark);
      color: var(--color-text);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    }

    /* 背景：枯山水・月 */
    .sanctuary-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 85% 15%, rgba(243, 235, 206, 0.15) 0%, transparent 45%),
                  linear-gradient(to bottom, #0a110d 0%, var(--color-noridark) 100%);
      z-index: 0;
    }

    .mountain-line {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 25vh;
      background: rgba(12, 20, 16, 0.7);
      clip-path: polygon(0% 100%, 0% 50%, 20% 40%, 40% 60%, 65% 35%, 85% 55%, 100% 45%, 100% 100%);
      pointer-events: none;
    }

    .moon {
      position: absolute;
      top: 20px;
      right: 25px;
      width: 44px;
      height: 44px;
      background-color: var(--color-moon);
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(243, 235, 206, 0.3);
      opacity: 0.85;
      pointer-events: none;
    }

    /* アプリ全体系（レスポンシブ・コンテナ） */
    .app-viewport {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 16px 16px;
    }

    /* ヘッダーエリア */
    .app-header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 40px;
    }

    .title-text {
      font-size: 1.0rem;
      color: var(--color-moon);
      letter-spacing: 0.15em;
      opacity: 0.9;
    }

    .header-controls {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(243, 235, 206, 0.08);
      border: 1px solid rgba(243, 235, 206, 0.2);
      color: var(--color-moon);
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(4px);
    }

    /* プレイエリア（縦並び配置） */
    .play-board {
      flex: 1;
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      background: rgba(26, 40, 32, 0.45);
      border: 1px solid rgba(243, 235, 206, 0.08);
      border-radius: 16px;
      padding: 8px;
      margin: 6px 0;
      backdrop-filter: blur(8px);
    }

    .card-row-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .row-label {
      font-size: 0.65rem;
      opacity: 0.5;
      letter-spacing: 0.1em;
      margin-bottom: 2px;
    }

    .card-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
      flex-wrap: nowrap;
    }

    /* 花札カードサイズ（レスポンシブ最適化） */
    .card {
      width: min(13vw, 54px);
      height: min(20vw, 84px);
      background-color: var(--color-card-bg);
      border-radius: 6px;
      border: 1.5px solid #2d261e;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      flex-shrink: 0;
    }

    .card.selected {
      border-color: var(--color-moon);
      box-shadow: 0 0 12px rgba(243, 235, 206, 0.6);
      transform: translateY(-8px);
    }

    .card.matched-hint {
      animation: gentlePulse 2s infinite alternate;
    }

    @keyframes gentlePulse {
      0% { box-shadow: 0 0 2px rgba(243, 235, 206, 0.2); }
      100% { box-shadow: 0 0 12px rgba(243, 235, 206, 0.7); }
    }

    .card-month {
      font-size: 0.6rem;
      color: #6e635a;
    }

    .card-symbol {
      font-size: min(5vw, 1.4rem);
      line-height: 1;
    }

    .card-name {
      font-size: 0.55rem;
      color: #3a332c;
    }

    /* フッター／ガイドテキスト */
    .app-footer {
      width: 100%;
      max-width: 800px;
      text-align: center;
      height: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .sleep-message {
      font-size: 0.75rem;
      color: var(--color-moon);
      opacity: 0.75;
      letter-spacing: 0.1em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 横画面時の自動レイアウト調整（メディアクエリ） */
    @media (min-aspect-ratio: 1/1) {
      .card {
        width: min(8vh, 56px);
        height: min(13vh, 88px);
      }
      .play-board {
        padding: 4px 12px;
      }
    }

    /* カメラモーダル（ダミーUI） */
    .camera-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 10;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .camera-frame {
      width: 260px;
      height: 180px;
      border: 2px dashed var(--color-moon);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--color-moon);
      font-size: 0.8rem;
      margin-bottom: 20px;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>

  <div class="sanctuary-bg"></div>
  <div class="mountain-line"></div>
  <div class="moon"></div>

  <div class="app-viewport">
    
    <!-- ヘッダーバー -->
    <div class="app-header">
      <div class="title-text">夜山に月すむ</div>
      <div class="header-controls">
        <!-- さりげないカメラ読み込みボタン -->
        <button class="icon-btn" onclick="openCamera()">📷 札読み込み</button>
        <button class="icon-btn" onclick="resetGame()">最初から</button>
      </div>
    </div>

    <!-- ゲームボード -->
    <div class="play-board">
      <!-- 相手の手札 -->
      <div class="card-row-wrapper">
        <div class="row-label">相手の手</div>
        <div class="card-row" id="cpu-hand"></div>
      </div>

      <!-- 場札 -->
      <div class="card-row-wrapper">
        <div class="row-label">場札</div>
        <div class="card-row" id="field-cards"></div>
      </div>

      <!-- 自分の手札 -->
      <div class="card-row-wrapper">
        <div class="row-label">自分の手</div>
        <div class="card-row" id="player-hand"></div>
      </div>
    </div>

    <!-- フッター（おやすみメッセージ＆スコア） -->
    <div class="app-footer">
      <div class="sleep-message" id="sleep-msg">札をふわりと、合わせてみましょう</div>
    </div>

  </div>

  <!-- カメラ読み込みのプレビュー画面（モーダル） -->
  <div class="camera-modal" id="camera-modal">
    <div class="camera-frame">実物の札をここに映すと<br>自動で読み込みます</div>
    <button class="icon-btn" onclick="closeCamera()">閉じる</button>
  </div>

  <script>
    const sampleCards = [
      { id: 1, month: '一月', name: '松', symbol: '🌲' },
      { id: 2, month: '一月', name: '鶴', symbol: '🕊️' },
      { id: 3, month: '二月', name: '梅', symbol: '🌸' },
      { id: 4, month: '二月', name: '鶯', symbol: '🐤' },
      { id: 5, month: '三月', name: '桜', symbol: '🌸' },
      { id: 6, month: '三月', name: '幕', symbol: '🍶' },
      { id: 7, month: '八月', name: 'ススキ', symbol: '🌾' },
      { id: 8, month: '八月', name: '月', symbol: '🌕' },
    ];

    let selectedHandCard = null;
    let matchedCount = 0;

    function initGame() {
      const fieldEl = document.getElementById('field-cards');
      const playerEl = document.getElementById('player-hand');
      const cpuEl = document.getElementById('cpu-hand');

      fieldEl.innerHTML = '';
      playerEl.innerHTML = '';
      cpuEl.innerHTML = '';

      // 場札 4枚
      [sampleCards[0], sampleCards[2], sampleCards[4], sampleCards[6]].forEach(card => {
        fieldEl.appendChild(createCardElement(card, 'field'));
      });

      // プレイヤー手札 4枚
      [sampleCards[1], sampleCards[3], sampleCards[5], sampleCards[7]].forEach(card => {
        playerEl.appendChild(createCardElement(card, 'player'));
      });

      // CPU手札 4枚（裏面）
      for(let i=0; i<4; i++) {
        const backCard = document.createElement('div');
        backCard.className = 'card';
        backCard.style.backgroundColor = 'var(--color-norimedium)';
        backCard.style.borderColor = 'rgba(243, 235, 206, 0.15)';
        cpuEl.appendChild(backCard);
      }
    }

    function createCardElement(cardData, type) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = cardData.id;
      card.dataset.month = cardData.month;

      card.innerHTML = `
        <span class="card-month">${cardData.month}</span>
        <span class="card-symbol">${cardData.symbol}</span>
        <span class="card-name">${cardData.name}</span>
      `;

      card.addEventListener('click', () => handleCardClick(card, cardData, type));
      return card;
    }

    function handleCardClick(cardEl, cardData, type) {
      const msgEl = document.getElementById('sleep-msg');

      if (type === 'player') {
        document.querySelectorAll('#player-hand .card').forEach(c => c.classList.remove('selected'));
        cardEl.classList.add('selected');
        selectedHandCard = cardData;

        document.querySelectorAll('#field-cards .card').forEach(fCard => {
          if (fCard.dataset.month === cardData.month) {
            fCard.classList.add('matched-hint');
          } else {
            fCard.classList.remove('matched-hint');
          }
        });

        msgEl.textContent = `${cardData.month}の札ですね。合わせる場札を選びましょう`;
      } 
      else if (type === 'field' && selectedHandCard) {
        if (cardEl.dataset.month === selectedHandCard.month) {
          cardEl.style.opacity = '0';
          const playerSelectedEl = document.querySelector('#player-hand .card.selected');
          if (playerSelectedEl) playerSelectedEl.style.opacity = '0';

          setTimeout(() => {
            cardEl.remove();
            if (playerSelectedEl) playerSelectedEl.remove();
            matchedCount += 2;
            msgEl.textContent = `ぽんと、静かに揃いました（現在 ${matchedCount} 札）`;
          }, 300);

          selectedHandCard = null;
        } else {
          msgEl.textContent = '月が異なるようです。ゆっくり選び直しましょう';
        }
      }
    }

    function openCamera() {
      document.getElementById('camera-modal').style.display = 'flex';
    }

    function closeCamera() {
      document.getElementById('camera-modal').style.display = 'none';
    }

    function resetGame() {
      matchedCount = 0;
      document.getElementById('sleep-msg').textContent = '札をふわりと、合わせてみましょう';
      initGame();
    }

    window.onload = initGame;
  </script>
</body>
</html>
